services:
  db:
    image: postgres:16
    container_name: movie_booking_db
    restart: always
    environment:
      POSTGRES_USER: movie_admin
      POSTGRES_PASSWORD: movie_password
      POSTGRES_DB: movie_booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: